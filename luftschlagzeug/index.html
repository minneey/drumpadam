<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Luftschlagzeug - A web-based drum machine">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Luftschlagzeug</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .drum-pads {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .drum-pad {
            aspect-ratio: 1;
            border: none;
            border-radius: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: bold;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }

        .drum-pad:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .drum-pad:active {
            transform: translateY(0);
            box-shadow: 0 2px 10px rgba(102, 126, 234, 0.4);
        }

        .pad-label {
            font-size: 0.7em;
            opacity: 0.8;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 100px;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        button:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
        }

        button:active {
            transform: scale(0.95);
        }

        .info {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85em;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🥁 Luftschlagzeug</h1>
        
        <div class="drum-pads">
            <button class="drum-pad" data-key="Q" data-sound="kick">
                <span>KICK</span>
                <span class="pad-label">Q</span>
            </button>
            <button class="drum-pad" data-key="W" data-sound="snare">
                <span>SNARE</span>
                <span class="pad-label">W</span>
            </button>
            <button class="drum-pad" data-key="E" data-sound="hihat-closed">
                <span>HI-HAT</span>
                <span class="pad-label">E</span>
            </button>
            <button class="drum-pad" data-key="A" data-sound="tom-high">
                <span>TOM H</span>
                <span class="pad-label">A</span>
            </button>
            <button class="drum-pad" data-key="S" data-sound="tom-mid">
                <span>TOM M</span>
                <span class="pad-label">S</span>
            </button>
            <button class="drum-pad" data-key="D" data-sound="tom-low">
                <span>TOM L</span>
                <span class="pad-label">D</span>
            </button>
            <button class="drum-pad" data-key="Z" data-sound="clap">
                <span>CLAP</span>
                <span class="pad-label">Z</span>
            </button>
            <button class="drum-pad" data-key="X" data-sound="cowbell">
                <span>BELL</span>
                <span class="pad-label">X</span>
            </button>
            <button class="drum-pad" data-key="C" data-sound="cymbal">
                <span>CYMBAL</span>
                <span class="pad-label">C</span>
            </button>
        </div>

        <div class="controls">
            <button id="clear-btn">Clear</button>
            <button id="settings-btn">Settings</button>
        </div>

        <div class="info">
            <p>Click pads or press keys to make sounds</p>
            <p>Offline support available</p>
        </div>
    </div>

    <script src="sw.js"></script>
    <script>
        // Initialize audio context
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        // Sound synthesis functions
        function playSound(type) {
            const now = audioContext.currentTime;
            const duration = 0.3;
            
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            
            osc.connect(gain);
            gain.connect(audioContext.destination);
            
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + duration);
            
            switch(type) {
                case 'kick':
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.5);
                    break;
                case 'snare':
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(200, now);
                    break;
                case 'hihat-closed':
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(300, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    break;
                case 'tom-high':
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
                    break;
                case 'tom-mid':
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(80, now + 0.2);
                    break;
                case 'tom-low':
                    osc.frequency.setValueAtTime(120, now);
                    osc.frequency.exponentialRampToValueAtTime(60, now + 0.25);
                    break;
                case 'clap':
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(250, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    break;
                case 'cowbell':
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(540, now);
                    break;
                case 'cymbal':
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(400, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    break;
            }
            
            osc.start(now);
            osc.stop(now + duration);
        }

        // Event listeners
        document.querySelectorAll('.drum-pad').forEach(pad => {
            pad.addEventListener('click', () => {
                const sound = pad.dataset.sound;
                playSound(sound);
                pad.style.opacity = '0.5';
                setTimeout(() => { pad.style.opacity = '1'; }, 100);
            });
        });

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            const pad = document.querySelector(`[data-key="${e.key.toUpperCase()}"]`);
            if (pad) {
                pad.click();
            }
        });

        // Register service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {
                console.log('Service Worker registration failed');
            });
        }
    </script>
</body>
</html>
